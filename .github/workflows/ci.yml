name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # build number = commit count

      - name: Install build tools
        run: brew install cmake ninja pkg-config xcodegen swiftlint

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Restore dependency build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/prefix
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/deps.lock', 'scripts/common.sh', 'scripts/build-deps.sh', 'patches/**/*.patch') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh

      - name: Assemble and check FreeRDP helper
        run: scripts/assemble-helper.sh

      - name: Lint, unit tests, app build, localization
        run: scripts/test.sh

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CardGate-debug
          path: build/DerivedData/Build/Products/Debug/CardGate.app
          retention-days: 7
