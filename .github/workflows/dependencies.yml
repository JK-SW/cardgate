name: Dependency updates

# Once a week: compares scripts/deps.lock with the upstream releases and opens an issue for each newer
# version (once; a closed issue is not opened again) and closes the issues a newer version replaces.
# No secrets, no build.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open issues for newer versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/check-dependency-updates.sh > updates.txt
          cat updates.txt
          scripts/report-dependency-updates.sh updates.txt
