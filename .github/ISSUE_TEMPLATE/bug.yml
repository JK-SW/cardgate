name: Chyba / Bug
description: Něco nefunguje nebo hlásí chybu. Something does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Bezpečnostní problém nehlaste tady**, ale neveřejně (SECURITY.md). Podporovaná je jen poslední verze:
        nejdřív aktualizujte (**CardGate → Zkontrolovat aktualizace…**) a ověřte, že problém trvá. Nikdy nepřikládejte PIN
        ani certifikát; skutečné adresy brány a počítače v popisu a na snímcích nahraďte např. `gateway.example.com`.
        **Do not report security problems here** (see SECURITY.md). Only the latest version is supported: update first
        (**CardGate → Check for Updates…**). Never include a PIN or a certificate; replace real addresses in the description
        and screenshots, e.g. with `gateway.example.com`.
  - type: textarea
    id: what
    attributes:
      label: Co se stalo / What happened
      description: Co jste dělali, co jste čekali a co se stalo (případně text hlášky). What you did, expected and got.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log připojení / Connection log
      description: |
        Přetáhněte sem archiv ZIP z **Okno → Log připojení → Uložit log…** – obsahuje verze aplikace a macOS, software karty
        a log; jména počítače a brány, název připojení a účet Windows jsou v něm nahrazená `***`. Drag here the ZIP from
        **Window → Connection Log → Save Log…** (versions, card software and the log; the names of the computer and gateway,
        the connection name and the Windows account are replaced with `***`).
